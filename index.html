<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Гараж — учёт расходов</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-hover: #2a2a2a;
    --yellow: #ffcc00;
    --yellow-dim: rgba(255, 204, 0, 0.15);
    --text: #ffffff;
    --text-muted: #888888;
    --danger: #ff4444;
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    height: 100vh;
    display: flex;
    justify-content: center;
  }

  /* Имитация телефона на десктопе */
  .app-container {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    box-shadow: 0 0 50px rgba(0,0,0,0.5);
  }

  /* ---------- ШАПКА ---------- */
  .header {
    padding: 20px 20px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .logo-icon {
    width: 32px;
    height: 32px;
    color: var(--yellow);
  }
  .settings-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 5px;
  }
  .settings-btn svg { width: 24px; height: 24px; }

  /* ---------- КОНТЕНТ ---------- */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 100px;
    scrollbar-width: none;
  }
  .main-content::-webkit-scrollbar { display: none; }

  .screen { display: none; animation: fadeIn 0.3s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- ГЛАВНАЯ ---------- */
  .total-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    margin-top: 10px;
    position: relative;
    overflow: hidden;
  }
  .total-title { color: var(--text-muted); font-size: 14px; margin-bottom: 8px; }
  .total-amount-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .total-amount { font-size: 32px; font-weight: 800; }
  .total-trend { color: #4ade80; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
  
  /* График (SVG) */
  .chart-container {
    height: 80px;
    width: 100%;
    position: relative;
  }
  .chart-svg { width: 100%; height: 100%; overflow: visible; }
  .chart-line { fill: none; stroke: var(--yellow); stroke-width: 3; stroke-linecap: round; }
  .chart-area { fill: url(#chartGradient); opacity: 0.3; }
  .chart-dot { fill: var(--bg); stroke: var(--yellow); stroke-width: 2; }

  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 30px 0 15px;
  }
  .section-title { font-size: 18px; font-weight: 600; }
  .section-link { color: var(--yellow); font-size: 14px; text-decoration: none; font-weight: 500; }

  /* Список расходов */
  .expense-list { display: flex; flex-direction: column; gap: 12px; }
  .expense-item {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: background 0.2s;
  }
  .expense-item:active { background: var(--surface-hover); }
  .expense-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    background: var(--surface-hover);
    flex-shrink: 0;
  }
  .expense-info { flex: 1; min-width: 0; }
  .expense-title { font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .expense-date { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .expense-amount { font-size: 16px; font-weight: 700; text-align: right; }
  
  /* Кнопка добавления (как в меню) */
  .fab-add {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 440px;
    background: var(--yellow);
    color: #000;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(255, 204, 0, 0.3);
    transition: transform 0.1s;
  }
  .fab-add:active { transform: translateX(-50%) scale(0.98); }
  .fab-add svg { width: 20px; height: 20px; }

  /* ---------- НИЖНЕЕ МЕНЮ ---------- */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #171717;
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 10px;
    font-weight: 500;
    background: none;
    border: none;
    cursor: pointer;
    transition: color 0.2s;
  }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item.active { color: var(--yellow); }

  /* ---------- ФОРМЫ И МОДАЛКИ ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: none;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--surface);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 20px; font-weight: 700; }
  .close-btn { background: var(--surface-hover); border: none; color: var(--text); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; display: grid; place-items: center; }

  .input-group { margin-bottom: 16px; }
  .input-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .input-group input, .input-group select {
    width: 100%;
    background: #121212;
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 14px;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
    transition: border 0.2s;
  }
  .input-group input:focus, .input-group select:focus { border-color: var(--yellow); }
  .btn-submit {
    width: 100%;
    background: var(--yellow);
    color: #000;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
  }

  /* ---------- СПИСОК АВТО ---------- */
  .car-list { display: flex; flex-direction: column; gap: 12px; }
  .car-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    border: 2px solid transparent;
    cursor: pointer;
  }
  .car-card.active { border-color: var(--yellow); }
  .car-logo {
    width: 48px;
    height: 48px;
    background: var(--surface-hover);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
  }
  .car-logo img { width: 32px; height: 32px; object-fit: contain; }
  .car-info { flex: 1; }
  .car-name { font-size: 16px; font-weight: 600; }
  .car-plate { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .car-del-btn { background: none; border: none; color: var(--text-muted); padding: 8px; cursor: pointer; }

  /* ---------- ОТЧЁТ ---------- */
  .report-controls {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .report-controls select { margin-bottom: 12px; }
  .btn-print {
    width: 100%;
    background: var(--surface-hover);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 14px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* Стили для самого документа отчета (внутри приложения - тёмные, при печати - белые) */
  .report-document {
    background: #fff;
    color: #000;
    border-radius: 16px;
    padding: 24px;
    font-size: 12px;
    line-height: 1.5;
  }
  .report-document h1 { font-size: 20px; margin-bottom: 5px; }
  .report-document .r-header { border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; }
  .report-document .r-car { margin-bottom: 20px; }
  .report-document .r-car-title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
  .report-document .r-car-details { color: #555; font-size: 11px; margin-bottom: 10px; }
  .report-document table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .report-document th { text-align: left; border-bottom: 1px solid #000; padding: 6px 0; font-size: 11px; text-transform: uppercase; }
  .report-document td { padding: 6px 0; border-bottom: 1px solid #eee; }
  .report-document .num { text-align: right; }
  .report-document .r-total { text-align: right; font-weight: bold; font-size: 14px; margin-top: 10px; }

  /* Скрываем интерфейс при печати, оставляем только отчет */
  @media print {
    body, .app-container, .main-content, .screen, .report-controls, .header, .bottom-nav, .fab-add, .modal-overlay {
      background: #fff !important;
      color: #000 !important;
      display: block !important;
      position: static !important;
      padding: 0 !important;
      margin: 0 !important;
      height: auto !important;
      overflow: visible !important;
    }
    .header, .bottom-nav, .fab-add, .report-controls, .modal-overlay, .section-header, .total-card, .expense-list { display: none !important; }
    
    /* Показываем только контейнер отчета */
    #screen-stats { display: block !important; }
    .report-document { padding: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
    .report-document * { color: #000 !important; }
    .report-document th { border-bottom: 2px solid #000 !important; }
    .report-document .r-header { border-bottom: 2px solid #000 !important; }
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- Шапка -->
  <header class="header">
    <div class="logo-area">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      ГАРАЖ
    </div>
    <button class="settings-btn" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <!-- Основной контент -->
  <main class="main-content">
    
    <!-- ГЛАВНАЯ -->
    <section id="screen-home" class="screen active">
      <div class="total-card">
        <div class="total-title">Общие расходы</div>
        <div class="total-amount-row">
          <div class="total-amount" id="home-total">0 ₽</div>
          <div class="total-trend">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline></svg>
            12%
          </div>
        </div>
        <div class="chart-container">
          <svg class="chart-svg" viewBox="0 0 300 80" preserveAspectRatio="none">
            <defs>
              <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--yellow)" />
                <stop offset="100%" stop-color="var(--yellow)" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path class="chart-area" d="M0,70 C30,60 40,30 70,40 C100,50 120,20 150,30 C180,40 200,10 230,20 C260,30 280,50 300,40 L300,80 L0,80 Z" />
            <path class="chart-line" d="M0,70 C30,60 40,30 70,40 C100,50 120,20 150,30 C180,40 200,10 230,20 C260,30 280,50 300,40" />
            <circle class="chart-dot" cx="70" cy="40" r="4" />
            <circle class="chart-dot" cx="150" cy="30" r="4" />
            <circle class="chart-dot" cx="230" cy="20" r="4" />
          </svg>
        </div>
      </div>

      <div class="section-header">
        <div class="section-title">Последние расходы</div>
        <a href="#" class="section-link" onclick="switchTab('stats'); return false;">Все →</a>
      </div>
      <div class="expense-list" id="home-recent-list">
        <!-- заполняется JS -->
      </div>
    </section>

    <!-- АВТО -->
    <section id="screen-cars" class="screen">
      <div class="section-header">
        <div class="section-title">Мои автомобили</div>
      </div>
      <div class="car-list" id="cars-list">
        <!-- заполняется JS -->
      </div>
      <button class="btn-submit" style="background: var(--surface); color: var(--text); border: 1px solid rgba(255,255,255,0.1);" onclick="openCarModal()">+ Добавить автомобиль</button>
    </section>

    <!-- СТАТИСТИКА / ОТЧЕТ -->
    <section id="screen-stats" class="screen">
      <div class="section-header">
        <div class="section-title">Отчёт</div>
      </div>
      <div class="report-controls">
        <div class="input-group">
          <label>Выберите автомобиль</label>
          <select id="report-car-select" onchange="renderReport()"></select>
        </div>
        <button class="btn-print" onclick="window.print()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
          Распечатать / PDF
        </button>
      </div>
      <div id="report-area">
        <!-- Отчет рендерится здесь -->
      </div>
    </section>

    <!-- ПРОФИЛЬ -->
    <section id="screen-profile" class="screen">
      <div class="section-header">
        <div class="section-title">Профиль</div>
      </div>
      <div class="total-card" style="margin-top: 0; text-align: center; padding: 30px 20px;">
        <div style="width: 64px; height: 64px; background: var(--yellow); color: #000; border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800; margin: 0 auto 15px;" id="profile-avatar">A</div>
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 5px;" id="profile-login">@user</div>
        <div style="color: var(--text-muted); font-size: 13px;" id="profile-date">Дата регистрации</div>
      </div>
      <button class="btn-submit" style="background: var(--surface); color: var(--danger); margin-top: 20px;" onclick="logout()">Выйти из аккаунта</button>
    </section>

  </main>

  <!-- Кнопка добавления (только на главной) -->
  <button class="fab-add" id="fab-add-btn" onclick="openExpenseModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Добавить расход
  </button>

  <!-- НИЖНЕЕ МЕНЮ -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Главная
    </button>
    <button class="nav-item" data-tab="cars" onclick="switchTab('cars')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></svg>
      Авто
    </button>
    <button class="nav-item" data-tab="stats" onclick="switchTab('stats')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      Отчёт
    </button>
    <button class="nav-item" data-tab="profile" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      Ещё
    </button>
  </nav>
</div>

<!-- МОДАЛКА: ДОБАВЛЕНИЕ РАСХОДА -->
<div class="modal-overlay" id="expense-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">Новый расход</div>
      <button class="close-btn" onclick="closeModal('expense-modal')">✕</button>
    </div>
    <form id="expense-form">
      <div class="input-group">
        <label>Категория</label>
        <select id="exp-category">
          <option value="⛽ Топливо">⛽ Топливо</option>
          <option value="🔧 ТО / Ремонт">🔧 ТО / Ремонт</option>
          <option value="🅿️ Парковка">🅿️ Парковка</option>
          <option value="🧼 Мойка">🧼 Мойка</option>
          <option value="🛞 Шины">🛞 Шины</option>
          <option value="📝 Штраф">📝 Штраф</option>
          <option value="📦 Другое">📦 Другое</option>
        </select>
      </div>
      <div class="input-group">
        <label>Сумма (₽)</label>
        <input type="number" id="exp-amount" required placeholder="0" min="0" step="0.01">
      </div>
      <div class="input-group">
        <label>Описание (необязательно)</label>
        <input type="text" id="exp-desc" placeholder="Например: замена масла">
      </div>
      <div class="input-group">
        <label>Дата</label>
        <input type="date" id="exp-date" required>
      </div>
      <div class="input-group">
        <label>Автомобиль</label>
        <select id="exp-car" required></select>
      </div>
      <button type="submit" class="btn-submit">Сохранить</button>
    </form>
  </div>
</div>

<!-- МОДАЛКА: ДОБАВЛЕНИЕ АВТО -->
<div class="modal-overlay" id="car-modal">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title">Новый автомобиль</div>
      <button class="close-btn" onclick="closeModal('car-modal')">✕</button>
    </div>
    <form id="car-form">
      <div class="input-group">
        <label>Марка</label>
        <input type="text" id="car-brand" required placeholder="Например: Toyota">
      </div>
      <div class="input-group">
        <label>Модель</label>
        <input type="text" id="car-model" required placeholder="Например: Camry">
      </div>
      <div class="input-group">
        <label>Госномер</label>
        <input type="text" id="car-plate" required placeholder="А123ВС77" maxlength="9">
      </div>
      <button type="submit" class="btn-submit">Добавить</button>
    </form>
  </div>
</div>

<script>
  // --- СОСТОЯНИЕ ---
  const LS_KEY = 'garage.v3';
  let state = {
    user: { login: 'driver', createdAt: Date.now() },
    cars: [],
    expenses: []
  };
  let currentCarId = null;

  // --- ЗАГРУЗКА / СОХРАНЕНИЕ ---
  function loadState() {
    const saved = localStorage.getItem(LS_KEY);
    if (saved) {
      try { state = JSON.parse(saved); } catch(e) {}
    }
    if (state.cars.length > 0) {
      currentCarId = state.cars[0].id;
    }
  }

  function saveState() {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    renderAll();
  }

  // --- УТИЛИТЫ ---
  const fmtMoney = n => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits: 0 }).format(n);
  const fmtDate = iso => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
  };
  const genId = () => Math.random().toString(36).substr(2, 9);
  const getCarName = (id) => {
    const c = state.cars.find(c => c.id === id);
    return c ? `${c.brand} ${c.model}` : 'Неизвестно';
  };

  // --- НАВИГАЦИЯ ---
  function switchTab(tabId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    
    document.getElementById('screen-' + tabId).classList.add('active');
    document.querySelector(`.nav-item[data-tab="${tabId}"]`).classList.add('active');

    // Скрываем кнопку добавления на других вкладках
    const fab = document.getElementById('fab-add-btn');
    if (tabId === 'home') {
      fab.style.display = 'flex';
    } else {
      fab.style.display = 'none';
    }

    if (tabId === 'stats') {
      updateReportSelect();
      renderReport();
    }
    if (tabId === 'profile') {
      renderProfile();
    }
  }

  // --- МОДАЛКИ ---
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  function openExpenseModal() {
    if (state.cars.length === 0) {
      alert('Сначала добавьте автомобиль во вкладке "Авто"');
      return;
    }
    
    // Заполняем селект машин
    const sel = document.getElementById('exp-car');
    sel.innerHTML = state.cars.map(c => `<option value="${c.id}">${c.brand} ${c.model} (${c.plate})</option>`).join('');
    
    // Ставим текущую дату
    document.getElementById('exp-date').valueAsDate = new Date();
    
    openModal('expense-modal');
  }

  function openCarModal() {
    document.getElementById('car-form').reset();
    openModal('car-modal');
  }

  // --- РЕНДЕР ---
  function renderAll() {
    renderHome();
    renderCars();
    if (document.getElementById('screen-stats').classList.contains('active')) {
      updateReportSelect();
      renderReport();
    }
  }

  function renderHome() {
    // Общая сумма
    const total = state.expenses.reduce((sum, e) => sum + Number(e.amount), 0);
    document.getElementById('home-total').textContent = fmtMoney(total);

    // Последние 5 расходов
    const recent = [...state.expenses].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);
    const list = document.getElementById('home-recent-list');
    
    if (recent.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">Пока нет расходов</div>';
      return;
    }

    list.innerHTML = recent.map(e => `
      <div class="expense-item">
        <div class="expense-icon">${e.category.split(' ')[0]}</div>
        <div class="expense-info">
          <div class="expense-title">${e.category.split(' ').slice(1).join(' ')} ${e.desc ? '('+e.desc+')' : ''}</div>
          <div class="expense-date">${fmtDate(e.date)} · ${getCarName(e.carId)}</div>
        </div>
        <div class="expense-amount">${fmtMoney(e.amount)}</div>
      </div>
    `).join('');
  }

  function renderCars() {
    const list = document.getElementById('cars-list');
    if (state.cars.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">Нет автомобилей</div>';
      return;
    }

    list.innerHTML = state.cars.map(c => `
      <div class="car-card ${c.id === currentCarId ? 'active' : ''}" onclick="selectCar('${c.id}')">
        <div class="car-logo">
          <span style="font-weight:800; font-size:20px; color:#fff;">${c.brand[0]}</span>
        </div>
        <div class="car-info">
          <div class="car-name">${c.brand} ${c.model}</div>
          <div class="car-plate">${c.plate}</div>
        </div>
        <button class="car-del-btn" onclick="event.stopPropagation(); deleteCar('${c.id}')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </button>
      </div>
    `).join('');
  }

  function selectCar(id) {
    currentCarId = id;
    renderCars();
  }

  function deleteCar(id) {
    if (!confirm('Удалить авто и все его расходы?')) return;
    state.cars = state.cars.filter(c => c.id !== id);
    state.expenses = state.expenses.filter(e => e.carId !== id);
    if (currentCarId === id) {
      currentCarId = state.cars.length > 0 ? state.cars[0].id : null;
    }
    saveState();
  }

  function renderProfile() {
    document.getElementById('profile-login').textContent = '@' + state.user.login;
    document.getElementById('profile-avatar').textContent = state.user.login[0].toUpperCase();
    document.getElementById('profile-date').textContent = 'С нами с ' + fmtDate(new Date(state.user.createdAt).toISOString());
  }

  // --- ОТЧЕТ ---
  function updateReportSelect() {
    const sel = document.getElementById('report-car-select');
    const currentVal = sel.value;
    sel.innerHTML = state.cars.map(c => `<option value="${c.id}">${c.brand} ${c.model} (${c.plate})</option>`).join('');
    if (currentVal && state.cars.find(c => c.id === currentVal)) {
      sel.value = currentVal;
    } else if (state.cars.length > 0) {
      sel.value = state.cars[0].id;
    }
  }

  function renderReport() {
    const carId = document.getElementById('report-car-select').value;
    const area = document.getElementById('report-area');
    
    if (!carId) {
      area.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">Добавьте автомобиль для формирования отчёта</div>';
      return;
    }

    const car = state.cars.find(c => c.id === carId);
    const carExpenses = state.expenses.filter(e => e.carId === carId).sort((a,b) => new Date(b.date) - new Date(a.date));
    const total = carExpenses.reduce((sum, e) => sum + Number(e.amount), 0);

    const rows = carExpenses.map(e => `
      <tr>
        <td>${fmtDate(e.date)}</td>
        <td>${e.category}</td>
        <td>${e.desc || '—'}</td>
        <td class="num">${fmtMoney(e.amount)}</td>
      </tr>
    `).join('');

    area.innerHTML = `
      <div class="report-document">
        <div class="r-header">
          <div>
            <h1>Отчёт по расходам</h1>
            <div style="font-size:12px; color:#666;">${car.brand} ${car.model} · ${car.plate}</div>
          </div>
          <div style="font-size:12px; text-align:right;">
            Дата формирования:<br><b>${fmtDate(new Date().toISOString())}</b>
          </div>
        </div>
        
        ${carExpenses.length ? `
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Категория</th>
                <th>Описание</th>
                <th class="num">Сумма</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
          <div class="r-total">Итого: ${fmtMoney(total)}</div>
        ` : '<div style="text-align:center; padding:20px; color:#888;">Расходов по этому автомобилю нет</div>'}
      </div>
    `;
  }

  // --- ОБРАБОТЧИКИ ФОРМ ---
  document.getElementById('expense-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const newExp = {
      id: genId(),
      carId: document.getElementById('exp-car').value,
      category: document.getElementById('exp-category').value,
      amount: parseFloat(document.getElementById('exp-amount').value),
      desc: document.getElementById('exp-desc').value.trim(),
      date: document.getElementById('exp-date').value
    };
    state.expenses.push(newExp);
    closeModal('expense-modal');
    e.target.reset();
    saveState();
  });

  document.getElementById('car-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const newCar = {
      id: genId(),
      brand: document.getElementById('car-brand').value.trim(),
      model: document.getElementById('car-model').value.trim(),
      plate: document.getElementById('car-plate').value.trim().toUpperCase()
    };
    state.cars.push(newCar);
    if (!currentCarId) currentCarId = newCar.id;
    closeModal('car-modal');
    e.target.reset();
    saveState();
  });

  function logout() {
    if(confirm('Выйти?')) {
      localStorage.removeItem(LS_KEY);
      location.reload();
    }
  }

  // --- ИНИЦИАЛИЗАЦИЯ ---
  loadState();
  renderAll();
  
  // Если нет машин, перекидываем на вкладку авто
  if (state.cars.length === 0) {
    switchTab('cars');
  } else {
    switchTab('home');
  }
</script>
</body>
</html>
